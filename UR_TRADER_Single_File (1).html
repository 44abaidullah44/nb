<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UR TRADER — Gold Trading Education</title>
<meta name="description" content="UR TRADER: gold market analysis, technical education, trading lessons and an online community.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff;
  --tx: #111;
  --mu: #5c5c5c;
  --gd: #b8902f;
  --gl: #f7f0dc;
  --cd: #fff;
  --bd: #ececec;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #fff;
    --tx: #111;
  }
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 70px;
}
body {
  margin: 0;
  background: #fff;
  color: var(--tx);
  font: 16px/1.7 'Plus Jakarta Sans', 'Poppins', sans-serif;
  letter-spacing: -0.01em;
}
a {
  color: inherit;
  text-decoration: none;
}
img {
  max-width: 100%;
}
.w {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 20px;
}
section {
  padding: 72px 0;
}
h1, h2, h3 {
  line-height: 1.25;
  margin: 0 0 12px;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  letter-spacing: 0.03em;
}
h2 {
  font-size: clamp(1.4rem, 3vw, 2.1rem);
  text-align: center;
  text-transform: uppercase;
}
.sub {
  color: var(--mu);
  text-align: center;
  max-width: 620px;
  margin: 0 auto 32px;
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #ffffffee;
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--bd);
  padding-top: env(safe-area-inset-top, 0px);
}
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}
.lg {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.lg img {
  height: 38px;
  width: 38px;
  object-fit: contain;
}
.mn {
  display: flex;
  gap: 22px;
  font-size: 0.88rem;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.mn a {
  color: var(--mu);
  transition: color 0.2s;
}
.mn a:hover {
  color: var(--gd);
}
#hb {
  display: none;
  background: none;
  border: 0;
  font-size: 1.6rem;
  cursor: pointer;
}
.btn {
  display: inline-block;
  padding: 11px 26px;
  border-radius: 999px;
  border: 1.5px solid var(--tx);
  font-weight: 600;
  font-size: 0.90rem;
  letter-spacing: 0.03em;
  cursor: pointer;
  background: #fff;
  transition: all 0.25s ease;
}
.btn:hover {
  border-color: var(--gd);
  color: var(--gd);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(184, 144, 47, 0.2);
}
.gold {
  background: linear-gradient(135deg, #c59f3f, #a98028);
  border-color: var(--gd);
  color: #fff;
}
.gold:hover {
  background: linear-gradient(135deg, #ad8525, #8f6a19);
  color: #fff;
}
.hero {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  align-items: center;
}
.hero h1 {
  font-size: clamp(2.4rem, 6vw, 4rem);
  letter-spacing: 0.05em;
  font-weight: 800;
}
.hero h2 {
  text-align: left;
  font-size: 1.28rem;
  color: var(--gd);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.pf {
  aspect-ratio: 1;
  border-radius: 24px;
  background: var(--gl);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 12px 40px #b8902f26;
}
.pf img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.pf span {
  color: var(--gd);
  font-size: 0.85rem;
  padding: 20px;
  text-align: center;
}
.grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}
.card {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 2px 12px #0000000a;
  transition: 0.25s;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--gd);
  box-shadow: 0 10px 26px #b8902f22;
}
.card svg {
  width: 28px;
  height: 28px;
  stroke: var(--gd);
  fill: none;
  stroke-width: 1.6;
}
.card h3 {
  font-size: 1rem;
  margin-top: 10px;
}
.card p {
  color: var(--mu);
  font-size: 0.88rem;
  margin: 0;
}
.soc {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
}
.so {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border: 1px solid var(--bd);
  border-radius: 999px;
  font-size: 0.9rem;
  transition: 0.25s;
  background: #fff;
}
.so:hover {
  border-color: var(--gd);
  color: var(--gd);
  transform: translateY(-3px);
}
.so svg {
  width: 22px;
  height: 22px;
}
.band {
  background: var(--gl);
  border-radius: 24px;
  padding: 48px 24px;
  text-align: center;
}
.band p {
  max-width: 620px;
  margin: 0 auto 22px;
  color: #444;
}
.band img {
  max-width: 100%;
  border-radius: 16px;
  margin-bottom: 20px;
}
.vd {
  overflow: hidden;
  padding: 0;
}
.th {
  aspect-ratio: 16/9;
  background: var(--gl);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gd);
  font-size: 2rem;
}
.th img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.vd h3 {
  padding: 12px 16px;
  font-size: 0.92rem;
  margin: 0;
}
.ab {
  display: grid;
  grid-template-columns: 1fr 1.5fr;
  gap: 36px;
  align-items: center;
}
form {
  display: grid;
  gap: 10px;
  max-width: 520px;
  margin: 24px auto 0;
}
input, textarea, select {
  font: inherit;
  padding: 10px 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  width: 100%;
}
.rv {
  opacity: 0;
  transform: translateY(22px);
  transition: opacity 0.7s, transform 0.7s;
}
.rv.in {
  opacity: 1;
  transform: none;
}
.hero > * {
  animation: fi 0.8s both;
}
.hero > *:nth-child(2) {
  animation-delay: 0.2s;
}
@keyframes fi {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
}
footer {
  border-top: 1px solid var(--bd);
  padding: 28px 0;
  text-align: center;
  color: var(--mu);
  font-size: 0.85rem;
}
#adm {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 30;
  display: block;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
#pn {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: #fff;
  overflow: auto;
  display: none;
  padding: 20px;
}
#pn .w {
  max-width: 760px;
}
#pn fieldset {
  border: 1px solid var(--bd);
  border-radius: 14px;
  margin: 0 0 16px;
  padding: 14px;
}
#pn legend {
  font-weight: 600;
  color: var(--gd);
}
#pn label {
  display: block;
  font-size: 0.8rem;
  color: var(--mu);
  margin: 8px 0 2px;
}
.row {
  display: grid;
  grid-template-columns: 1.1fr 2fr 0.6fr auto auto;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.row.v {
  grid-template-columns: 1fr 1.4fr auto auto auto auto;
}
.row input {
  padding: 7px 9px;
}
.sm {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
}
.hide {
  display: none !important;
}
@media (max-width: 760px) {
  .mn {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    background: #fff;
    flex-direction: column;
    padding: 0 20px;
    gap: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s;
    border-bottom: 1px solid var(--bd);
  }
  .mn.o {
    max-height: 420px;
  }
  .mn a {
    padding: 12px 0;
  }
  #hb {
    display: block;
  }
  .hero, .ab {
    grid-template-columns: 1fr;
  }
  .row, .row.v {
    grid-template-columns: 1fr 1fr;
  }
  section {
    padding: 48px 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .rv {
    opacity: 1;
    transform: none;
  }
}

</style>

const isSafeUrl = (u: string) => /^(https?:\/\/|mailto:)/i.test(u || '');

const mergeConfig = (base: SiteConfig, saved: any): SiteConfig => {
  if (!saved || typeof saved !== 'object') return base;
  return {
    ...base,
    ...saved,
    hero: { ...base.hero, ...(saved.hero || {}) },
    edu: { ...base.edu, ...(saved.edu || {}) },
    vip: { ...base.vip, ...(saved.vip || {}) },
    about: { ...base.about, ...(saved.about || {}) },
    contact: { ...base.contact, ...(saved.contact || {}) },
    yt: {
      ...base.yt,
      ...(saved.yt || {}),
      vids: Array.isArray(saved.yt?.vids) ? saved.yt.vids : base.yt.vids,
    },
    hl: Array.isArray(saved.hl) && saved.hl.length ? saved.hl : base.hl,
    soc: Array.isArray(saved.soc) && saved.soc.length ? saved.soc : base.soc,
    sec: Array.isArray(saved.sec) && saved.sec.length ? saved.sec : base.sec,
  };
};

  const [config, setConfig] = useState<SiteConfig>(() => {
    try {
      const saved = localStorage.getItem('ur_trader_site_config');
      if (saved) {
        return mergeConfig(DEFAULT_CONFIG, JSON.parse(saved));

    return DEFAULT_CONFIG;

  const [passcodeModalOpen, setPasscodeModalOpen] = useState(false);
  const [passcodeInput, setPasscodeInput] = useState('');
  const [passcodeError, setPasscodeError] = useState('');
  const [clickCount, setClickCount] = useState(0);
  const clickTimeoutRef = useRef<number | null>(null);

  const handleFooterClick = () => {
    if (clickTimeoutRef.current) {
      window.clearTimeout(clickTimeoutRef.current);
    }
    // Reset if no click for 5 seconds
    clickTimeoutRef.current = window.setTimeout(() => {
      setClickCount(0);
    }, 5000);

    const next = clickCount + 1;
    if (next >= 10) {
      setClickCount(0);
      setPasscodeModalOpen(true);
      setPasscodeError('');
      setPasscodeInput('');
    } else {
      setClickCount(next);
    }
  };

  const handlePasscodeSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    if (passcodeInput === 'abaidull77') {
      setPasscodeModalOpen(false);
      setPasscodeInput('');
      setPasscodeError('');
      setPanelOpen(true);
    } else {
      setPasscodeError('غلط کوڈ! درست پاس کوڈ درج کریں۔ / Incorrect passcode!');
    }
  };

  // Scroll reveal observer
  const containerRef = useRef<HTMLDivElement>(null);

  useEffect(() => {
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12 }
    );

    const elements = document.querySelectorAll('.rv');
    elements.forEach((el) => io.observe(el));

    return () => io.disconnect();
  }, [config, panelOpen]);

  const compressImageFile = (file: File, maxWidth = 1000, quality = 0.82): Promise<string> => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const raw = e.target?.result as string;
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            resolve(raw);
            return;
          }
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(raw);
        img.src = raw;
      };
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    });

                  onChange={(e) => updatePath('hero.title', e.target.value)}
                />

                <label>Hero headline</label>
                <input
                  value={config.hero.head}
                  onChange={(e) => updatePath('hero.head', e.target.value)}
                />

                <label>Hero description</label>
                <input
                  value={config.hero.text}
                  onChange={(e) => updatePath('hero.text', e.target.value)}
                />

                <label>Hero button 1 label</label>
                <input
                  value={config.hero.b1}
                  onChange={(e) => updatePath('hero.b1', e.target.value)}
                />

                <label>Hero button 2 label</label>
                <input
                  value={config.hero.b2}
                  onChange={(e) => updatePath('hero.b2', e.target.value)}
                />
              </fieldset>

              {/* Highlights */}
              <fieldset>
                <legend>Highlights (text only — no invented stats)</legend>
                {config.hl.map((item, idx) => (
                  <div key={idx} style={{ marginBottom: '10px' }}>
                    <label>Title {idx + 1}</label>
                    <input
                      value={item.t}
                      onChange={(e) => updatePath(`hl.${idx}.t`, e.target.value)}
                    />
                    <label>Text</label>
                    <input
                      value={item.d}
                      onChange={(e) => updatePath(`hl.${idx}.d`, e.target.value)}
                    />
                  </div>
                ))}
              </fieldset>

              {/* Trading Education */}
              <fieldset>
                <legend>Trading education / courses</legend>
                <label>Title</label>
                <input
                  value={config.edu.title}
                  onChange={(e) => updatePath('edu.title', e.target.value)}
                />
                <label>Text</label>
                <input
                  value={config.edu.text}
                  onChange={(e) => updatePath('edu.text', e.target.value)}
                />

                <label>Course banner</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={(e) => handleFileUpload('edu.banner', e.target.files?.[0])}
                />

                <label>Button 1 label</label>
                <input
                  value={config.edu.b1}
                  onChange={(e) => updatePath('edu.b1', e.target.value)}
                />
                <label>Button 1 URL</label>
                <input
                  value={config.edu.u1}
                  onChange={(e) => updatePath('edu.u1', e.target.value)}
                />

                <label>Button 2 label</label>
                <input
                  value={config.edu.b2}
                  onChange={(e) => updatePath('edu.b2', e.target.value)}
                />
                <label>Button 2 URL</label>
                <input
                  value={config.edu.u2}
                  onChange={(e) => updatePath('edu.u2', e.target.value)}
                />

                <label>Button 3 label</label>
                <input
                  value={config.edu.b3}
                  onChange={(e) => updatePath('edu.b3', e.target.value)}
                />
                <label>Button 3 URL</label>
                <input
                  value={config.edu.u3}
                  onChange={(e) => updatePath('edu.u3', e.target.value)}
                />
              </fieldset>

              {/* Social Links */}
              <fieldset>
                <legend>Social links (empty URL = hidden)</legend>
                {config.soc.map((s, idx) => (
                  <div className="row" key={idx}>
                    <input
                      value={s.l}
                      onChange={(e) => updatePath(`soc.${idx}.l`, e.target.value)}
                      aria-label="Label"
                      placeholder="Label"
                    />
                    <input
                      value={s.u}
                      onChange={(e) => updatePath(`soc.${idx}.u`, e.target.value)}
                      placeholder={`${s.n} URL`}
                      aria-label="URL"
                    />
                    <input
                      type="number"
                      value={s.o}
                      onChange={(e) => updatePath(`soc.${idx}.o`, e.target.value)}
                      aria-label="Order"
                    />
                    <label style={{ margin: 0, display: 'flex', alignItems: 'center', gap: '4px' }}>
                      <input
                        type="checkbox"
                        checked={Boolean(s.on)}
                        onChange={(e) => updatePath(`soc.${idx}.on`, e.target.checked ? 1 : 0)}
                        style={{ width: 'auto' }}
                      />{' '}
                      on
                    </label>
                  </div>
                ))}
              </fieldset>

              {/* VIP Group */}
              <fieldset>
                <legend>VIP group &amp; WhatsApp</legend>
                <label>Button label</label>
                <input
                  value={config.vip.btn}
                  onChange={(e) => updatePath('vip.btn', e.target.value)}
                />
                <label>Description</label>
                <input
                  value={config.vip.text}
                  onChange={(e) => updatePath('vip.text', e.target.value)}
                />
                <label>Extra description</label>
                <input
                  value={config.vip.desc}
                  onChange={(e) => updatePath('vip.desc', e.target.value)}
                />
                <label>WhatsApp group/channel invitation link</label>
                <input
                  value={config.vip.invite}
                  onChange={(e) => updatePath('vip.invite', e.target.value)}
                />
                <label>WhatsApp number (shown)</label>
                <input
                  value={config.vip.phone}
                  onChange={(e) => updatePath('vip.phone', e.target.value)}
                />
                <label>WhatsApp direct chat link</label>
                <input
                  value={config.vip.chat}
                  onChange={(e) => updatePath('vip.chat', e.target.value)}
                />
                <label>VIP banner</label>
                <input
                  type="file"
                  accept="image/*"
                  onChange={(e) => handleFileUpload('vip.banner', e.target.files?.[0])}
                />
              </fieldset>

              {/* YouTube */}
              <fieldset>
                <legend>YouTube</legend>
                <label>Channel URL</label>
                <input
                  value={config.yt.channel}
                  onChange={(e) => updatePath('yt.channel', e.target.value)}
                />
                <div id="vl">
                  {config.yt.vids.map((v, idx) => (
                    <div className="row v" key={idx}>
                      <input
                        value={v.t}
                        placeholder="Title"
                        onChange={(e) => updatePath(`yt.vids.${idx}.t`, e.target.value)}
                      />
                      <input
                        value={v.u}
                        placeholder="Video URL"
                        onChange={(e) => updatePath(`yt.vids.${idx}.u`, e.target.value)}
                      />
                      <button className="sm" onClick={() => moveItem('vids', idx, -1)}>
                        ↑
                      </button>
                      <button className="sm" onClick={() => moveItem('vids', idx, 1)}>
                        ↓
                      </button>
                      <button className="sm" onClick={() => removeVideo(idx)}>
                        ✕
                      </button>
                      <input
                        type="file"
                        accept="image/*"
                        title="Thumbnail"
                        onChange={(e) => handleFileUpload(`yt.vids.${idx}.th`, e.target.files?.[0])}
                      />
                    </div>
                  ))}
                </div>
                <button className="sm" style={{ marginTop: '8px' }} onClick={addVideo}>
                  + Add video
                </button>
              </fieldset>

              {/* About & Contact */}
              <fieldset>
                <legend>About &amp; contact</legend>
                <label>About text</label>
                <input
                  value={config.about.text}
                  onChange={(e) => updatePath('about.text', e.target.value)}
                />
                <label>Biography</label>
                <input
                  value={config.about.bio}
                  onChange={(e) => updatePath('about.bio', e.target.value)}
                />
                <label>Real experience / qualifications (leave blank if none)</label>
                <input
                  value={config.about.creds}
                  onChange={(e) => updatePath('about.creds', e.target.value)}
                />
                <label>Contact email</label>
                <input
                  value={config.contact.email}
                  onChange={(e) => updatePath('contact.email', e.target.value)}
                />
                <label style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <input
                    type="checkbox"
                    checked={Boolean(config.contact.form)}
                    onChange={(e) => updatePath('contact.form', e.target.checked ? 1 : 0)}
                    style={{ width: 'auto' }}
                  />{' '}
                  Show contact form
                </label>
              </fieldset>

              {/* Sections (order & visibility) */}
              <fieldset>
                <legend>Sections (order &amp; visibility)</legend>
                {config.sec.map((s, idx) => (
                  <div
                    className="row v"
                    key={idx}
                    style={{ gridTemplateColumns: 'auto 1fr auto auto' }}
                  >
                    <input
                      type="checkbox"
                      checked={Boolean(s.on)}
                      onChange={(e) => updatePath(`sec.${idx}.on`, e.target.checked ? 1 : 0)}
                      style={{ width: 'auto' }}
                    />
                    <span>{s.id}</span>
                    <button className="sm" onClick={() => moveItem('sec', idx, -1)}>
                      ↑
                    </button>
                    <button className="sm" onClick={() => moveItem('sec', idx, 1)}>
                      ↓
                    </button>
                  </div>
                ))}
              </fieldset>
            </div>

            {/* Bottom buttons */}
            <div
              style={{
                position: 'sticky',
                bottom: 0,
                background: '#fff',
                padding: '14px 0',
                borderTop: '1.5px solid var(--bd)',
                display: 'flex',
                flexWrap: 'wrap',
                alignItems: 'center',
                gap: '10px',
              }}
            >
              <button
                className="btn gold"
                id="sv"
                onClick={handleSave}
                style={{ padding: '10px 22px', fontSize: '0.92rem' }}
              >
                💾 Publish Live (ویب سائٹ پر پبلش کریں)
              </button>

              <button
                className="btn"
                onClick={handleExportConfig}
                title="Download backup JSON"
                style={{ padding: '9px 16px', fontSize: '0.86rem' }}
              >
                📥 Export Backup
              </button>

              <label
                className="btn"
                style={{ padding: '9px 16px', fontSize: '0.86rem', margin: 0, cursor: 'pointer' }}
                title="Upload backup JSON"
              >
                📤 Import Backup
                <input
                  type="file"
                  accept=".json,application/json"
                  style={{ display: 'none' }}
                  onChange={(e) => handleImportConfig(e.target.files?.[0])}
                />
              </label>

              <button
                className="btn"
                id="cl"
                onClick={() => setPanelOpen(false)}
                style={{ padding: '9px 16px', fontSize: '0.86rem' }}
              >
                Close / بند
              </button>

              <button
                className="btn"
                style={{ marginLeft: 'auto', padding: '9px 16px', fontSize: '0.84rem' }}
                onClick={() => {
                  if (window.confirm('Reset all settings to default UR TRADER template?')) {
                    setConfig(DEFAULT_CONFIG);
                    localStorage.removeItem('ur_trader_site_config');
                    saveToServer(DEFAULT_CONFIG);
                    setStatusMsg('Reset to default');
                  }
                }}
              >
                Reset Default
              </button>

              {statusMsg && (
                <div
                  id="ms"
                  style={{
                    width: '100%',
                    marginTop: '4px',
                    fontWeight: 600,
                    color: 'var(--gd)',
                    fontSize: '0.88rem',
                  }}
                >
                  {statusMsg}
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

</script>
<script type="text/babel" data-presets="react">
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
